[project]
name = "bountyclaw"
version = "0.19.0"
description = "Local-first authorized bug bounty research assistant CLI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
  { name = "BountyClaw Project" }
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "mypy>=1.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "build>=1.2",
]

[project.scripts]
bountyclaw = "bountyclaw.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.bountyclaw]
phase = "19"
network_default = "disabled"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.bandit]
skips = ["B101"]
exclude_dirs = ["tests"]
